<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>房东管家</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 手机比例列（仅保持手机般修长比例，无仿真边框/状态栏） -->
  <div class="app">
    <header class="appbar"><span id="appbar-title">概览</span></header>
    <main id="page" class="page"><!-- 各 Tab 内容由 app.js 注入 --></main>
    <nav class="tabbar" id="tabbar">
      <button class="tabbar__item is-active" data-tab="overview">
        <span class="tabbar__icon">🏠</span><span class="tabbar__label">概览</span>
      </button>
      <button class="tabbar__item" data-tab="houses">
        <span class="tabbar__icon">🏢</span><span class="tabbar__label">房源</span>
      </button>
      <button class="tabbar__item" data-tab="reminders">
        <span class="tabbar__icon">🔔</span><span class="tabbar__label">提醒</span>
      </button>
    </nav>
  </div>

  <!-- UMD 纯函数（浏览器挂 window.LRM；jest 走 module.exports） -->
  <script src="js/utils/amount.js"></script>
  <script src="js/utils/date.js"></script>
  <script src="js/utils/status.js"></script>
  <script src="js/utils/dom.js"></script>
  <!-- 数据层（T4/T8/T9/T11/T12/T13/T14）：通用存储 → 示例数据 → 各集合封装 -->
  <script src="js/data/store.js"></script>
  <script src="js/data/mockData.js"></script>
  <script src="js/data/houseRepo.js"></script>
  <script src="js/data/attachmentRepo.js"></script>
  <script src="js/data/channelRepo.js"></script>
  <script src="js/data/showingRepo.js"></script>
  <script src="js/data/signingRepo.js"></script>
  <script src="js/data/leaseRepo.js"></script>
  <script src="js/data/tenantRepo.js"></script>
  <script src="js/data/utilityRepo.js"></script>
  <script src="js/data/handoverRepo.js"></script>
  <script src="js/data/repairRepo.js"></script>
  <!-- 视图层（T5/T6/T7/T8/T9/T10/T11/T12/T13/T14） -->
  <script src="js/views/houseCard.js"></script>
  <script src="js/views/housesPage.js"></script>
  <script src="js/views/houseForm.js"></script>
  <script src="js/views/attachment.js"></script>
  <script src="js/views/channelPage.js"></script>
  <script src="js/views/showingPage.js"></script>
  <script src="js/views/priceStrategyPage.js"></script>
  <script src="js/views/signingPage.js"></script>
  <script src="js/views/leasePage.js"></script>
  <script src="js/views/utilityPage.js"></script>
  <script src="js/views/repairPage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
